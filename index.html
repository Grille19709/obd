<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>OBD-Live</title>
<style>
 body{margin:0;background:#000;color:#fff;font-family:sans-serif}
 header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #444}
 h1{margin:0;font-size:20px;color:#0ff;flex:1}
 #status{font-size:14px;color:#888}
 button{font-size:16px;padding:8px 14px;border:0;border-radius:8px;background:#0aa;color:#000;font-weight:bold}
 button:disabled{background:#333;color:#777}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px}
 .kachel{background:#111;border-radius:10px;padding:12px}
 .name{font-size:15px;color:#ccc}
 .wert{font-size:40px;font-weight:bold;text-align:right;font-variant-numeric:tabular-nums}
 .einheit{font-size:14px;color:#888;text-align:right}
 .alt{color:#555!important}
 #hinweis{padding:0 14px;color:#f80;font-size:14px}
 h2{margin:6px 14px 0;font-size:16px;color:#0ff;font-weight:normal}
 h2 span{color:#ccc}
</style></head><body>
<header><h1>OBD-Live</h1><span id="status">getrennt</span><button id="knopf">Verbinden</button></header>
<p id="hinweis"></p>
<div class="grid" id="grid"></div>
<h2>Solar <span id="zustand">--</span></h2>
<div class="grid" id="solar"></div>
<h2>Akku <span id="fets">--</span></h2>
<div class="grid" id="akku"></div>
<script>
// müssen mit ble_anzeige/src/main.cpp übereinstimmen
const SERVICE_UUID = "263ce341-1fb4-4abd-b38b-3bc1ea241e76";
const WERTE_UUID   = "8038be20-f5a2-421c-83ab-91d6e985bf0d";

// Reihenfolge wie enum Wert; skala wie SKALA[] in der Firmware
const W = [["drehzahl","Drehzahl","U/min",0,1],["tempo","Tempo","km/h",0,1],
 ["kuehlmittel","Kühlmittel","°C",0,1],["batterie","Batterie","V",1,100],
 ["ladedruck","Ladedruck","bar",2,100],["raildruck","Raildruck","bar",0,1],
 ["luftmasse","Luftmasse","g/s",1,10],["last","Motorlast","%",0,1]];
// Solarwerte aus Paket Typ 1: [id, Name, Einheit, Nachkommastellen]
const S = [["pv","PV-Leistung","W",0],["ladestrom","Ladestrom","A",1],
 ["akku","Akku","V",2],["ertrag","Ertrag heute","kWh",2]];
// Akkuwerte aus Paket Typ 2
const A = [["ladestand","Ladestand","%",0],["akkuspannung","Spannung","V",2],
 ["akkustrom","Strom","A",1],["akkuleistung","Leistung","W",0],
 ["rest","Restkapazität","Ah",0],["temperatur","Temperatur","°C",1]];
const ZUSTAND = {0:"aus",2:"Fehler",3:"Bulk",4:"Absorption",5:"Float",6:"Storage",
 7:"Ausgleich",245:"Start",252:"extern gesteuert"};
const STATUS = ["Start","verbinde mit Auto…","kein Bluetooth zum Adapter","ELM327 stumm","verbunden","Verbindung weg"];

const $ = id => document.getElementById(id);
const kachel = ([id, name, einheit]) =>
  `<div class="kachel"><div class="name">${name}</div><div class="wert alt" id="${id}">--</div><div class="einheit">${einheit}</div></div>`;
for (const w of W) $("grid").insertAdjacentHTML("beforeend", kachel(w));
for (const w of S) $("solar").insertAdjacentHTML("beforeend", kachel(w));
for (const w of A) $("akku").insertAdjacentHTML("beforeend", kachel(w));

function farbe(id, v) {
  if (id == "kuehlmittel") return v < 70 ? "#0ff" : v > 105 ? "#f00" : "#0f0";
  if (id == "batterie") return (v < 11.8 || v > 15) ? "#f00" : "#0f0";
  if (id == "akku") return (v < 12 || v > 14.6) ? "#f00" : "#0f0";
  if (id == "pv") return v > 0 ? "#ff0" : "#888";
  if (id == "ladestand") return v < 20 ? "#f00" : v < 50 ? "#ff0" : "#0f0";
  if (id == "akkustrom" || id == "akkuleistung") return v > 0.1 ? "#0f0" : "#fff";
  if (id == "temperatur") return (v < 0 || v > 45) ? "#f00" : "#fff";
  return "#fff";
}

function zeige(id, v, nk) {
  const el = $(id);
  if (v === null) { el.textContent = "--"; el.classList.add("alt"); return; }
  el.textContent = v.toFixed(nk); el.classList.remove("alt"); el.style.color = farbe(id, v);
}

function alleUngueltig() {
  for (const [id] of [...W, ...S, ...A]) zeige(id, null);
  $("zustand").textContent = $("fets").textContent = "--";
}

// Paketformat siehe Kopf von ble_anzeige/src/main.cpp; erstes Byte = Typ
function empfange(e) {
  const d = e.target.value;
  if (d.getUint8(0) == 0) {          // OBD: 8 x int16 (-32768 = ungültig), Status
    W.forEach(([id, , , nk, skala], i) => {
      const roh = d.getInt16(1 + 2 * i, true);
      zeige(id, roh == -32768 ? null : roh / skala, nk);
    });
    $("status").textContent = "ESP32: " + (STATUS[d.getUint8(17)] ?? "?");
  } else if (d.getUint8(0) == 1) {   // Solar: Zustand, Fehler, V, A, kWh, W
    const z = d.getUint8(1), da = z != 0xFF;
    const v = [d.getUint16(9, true), d.getInt16(5, true) / 10, d.getInt16(3, true) / 100, d.getUint16(7, true) / 100];
    S.forEach(([id, , , nk], i) => zeige(id, da ? v[i] : null, nk));
    const fehler = d.getUint8(2);
    $("zustand").textContent = !da ? "keine Daten" : (ZUSTAND[z] ?? "Zustand " + z) + (fehler ? " – Fehler " + fehler : "");
  } else if (d.getUint8(0) == 2) {   // Akku: %, V, A, Ah, °C, MOSFETs
    const soc = d.getUint8(1), da = soc != 0xFF;
    const u = d.getUint16(2, true) / 100, i = d.getInt16(4, true) / 100, t = d.getInt16(8, true);
    const v = [soc, u, i, u * i, d.getUint16(6, true) / 10, t == -32768 ? null : t / 10];
    A.forEach(([id, , , nk], k) => zeige(id, da ? v[k] : null, nk));
    const f = d.getUint8(10);
    $("fets").textContent = !da ? "keine Daten"
      : (f & 3) == 3 ? (i > 0.1 ? "lädt" : i < -0.1 ? "entlädt" : "Ruhe")
      : "BMS hat abgeschaltet: " + [!(f & 1) && "Laden", !(f & 2) && "Entladen"].filter(Boolean).join(" + ");
  }
}

let geraet = null;

async function verbinde() {
  $("knopf").disabled = true;
  $("status").textContent = "verbinde…";
  try {
    const server = await geraet.gatt.connect();
    const dienst = await server.getPrimaryService(SERVICE_UUID);
    const werte  = await dienst.getCharacteristic(WERTE_UUID);
    werte.addEventListener("characteristicvaluechanged", empfange);
    await werte.startNotifications();
    $("status").textContent = "verbunden";
    $("knopf").textContent = "Trennen";
  } catch (err) {
    $("status").textContent = "Fehler: " + err.message;
    $("knopf").textContent = "Verbinden";
  }
  $("knopf").disabled = false;
}

// Verbindung abgerissen (z. B. Zündung aus): alle 3 s neu versuchen
function getrennt() {
  alleUngueltig();
  $("knopf").textContent = "Verbinden";
  if (!geraet) return;
  $("status").textContent = "getrennt – versuche neu…";
  setTimeout(() => { if (geraet && !geraet.gatt.connected) verbinde(); }, 3000);
}

$("knopf").onclick = async () => {
  if (geraet && geraet.gatt.connected) {   // Trennen
    const g = geraet; geraet = null; g.gatt.disconnect();
    $("status").textContent = "getrennt";
    return;
  }
  try {
    geraet = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
    geraet.addEventListener("gattserverdisconnected", getrennt);
    verbinde();
  } catch (err) {
    geraet = null;
    $("status").textContent = err.name == "NotFoundError" ? "kein Gerät gewählt" : "Fehler: " + err.message;
  }
};

if (!navigator.bluetooth) {
  $("knopf").disabled = true;
  $("hinweis").textContent = "Dieser Browser kann kein Bluetooth. Bitte Chrome auf Android verwenden "
    + "(Seite muss über https geöffnet sein).";
}

// Bildschirm anlassen, solange die Seite offen ist
async function wachBleiben() { try { await navigator.wakeLock.request("screen"); } catch (e) {} }
wachBleiben();
document.addEventListener("visibilitychange", () => { if (document.visibilityState == "visible") wachBleiben(); });

// offline nutzbar machen (Auto ohne Netz)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script></body></html>
