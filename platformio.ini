; KitelinerOS + OBD - JC4827W543 (Guition 4.3" ESP32-S3, NV3041A QSPI)
; Camper van panel with engine values (BLE ELM327), Victron solar and LiFePO4 BMS.
; Combined from "ESP32 LCD Camper Van" and "OBD Adapter/ble_anzeige".

[env:JC4827W543]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Memory: QSPI Flash + OPI PSRAM (matches official JC4827W543 demo)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.psram_enable = true
board_upload.flash_size = 4MB

; Partitions (Bluetooth needs the space)
board_build.partitions = huge_app.csv

; Serial Monitor
monitor_speed = 115200
monitor_filters = direct

; Libraries
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git
    powerbroker2/ELMduino

; Build flags (from official demo + USB CDC for serial over USB)
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Upload
upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --before=default_reset
    --after=hard_reset
